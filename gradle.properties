pluginGroup = dev.spotidea
pluginName = Backbeat
pluginVersion = 0.1.0

# Oldest IDE we compile against and support. No upper bound: the plugin only uses stable platform API.
platformVersion = 2025.3
pluginSinceBuild = 253

# Optional: build against an IDE that is already installed instead of downloading one, e.g.
#   ./gradlew buildPlugin -PlocalIdePath="C:/Program Files/JetBrains/IntelliJ IDEA 2025.3"
# localIdePath =

# The IDE ships its own Kotlin stdlib and coroutines; never bundle a second copy.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
